name: Build native Frida session helper

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/device/native-frida-helper/**"
      - "bridge/device/native-runtime-launcher/**"
      - ".github/workflows/build-native-frida-helper.yml"
      - "test/device-native-runtime-launcher.test.c"
      - "test/device-native-helper-binary-output.test.c"
      - "test/device-native-helper-contract.test.mjs"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out Frida license
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: frida/frida-core
          ref: 16.3.3
          path: .frida-core-source
          persist-credentials: false

      - name: Prepare pinned iOS arm64 devkit
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frida-core-devkit.tar.xz"
          devkit="$RUNNER_TEMP/frida-core-devkit"
          url="https://github.com/frida/frida/releases/download/16.3.3/frida-core-devkit-16.3.3-ios-arm64.tar.xz"
          expected="C31AA39618A6996BF43A472F2F48E3E4C2CC72EEE101A1ED6820192CBF58BDEC"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' "$expected" "$archive" | shasum --algorithm 256 --check --status
          mkdir -p "$devkit"
          tar -xJf "$archive" -C "$devkit"
          test -s "$devkit/frida-core.h"
          test -s "$devkit/libfrida-core.a"
          echo "FRIDA_DEVKIT=$devkit" >> "$GITHUB_ENV"

      - name: Test launcher validation and fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror \
            test/device-native-runtime-launcher.test.c \
            -o "$RUNNER_TEMP/device-native-runtime-launcher-test"
          "$RUNNER_TEMP/device-native-runtime-launcher-test"

      - name: Test bounded binary output descriptor contract
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror \
            test/device-native-helper-binary-output.test.c \
            bridge/device/native-frida-helper/binary-output.c \
            -o "$RUNNER_TEMP/device-native-helper-binary-output-test"
          "$RUNNER_TEMP/device-native-helper-binary-output-test"

      - name: Test native helper lifecycle contract
        shell: bash
        run: node --test test/device-native-helper-contract.test.mjs

      - name: Build iOS 15+ arm64 helper
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          out="$RUNNER_TEMP/native-frida-helper"
          mkdir -p "$out"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" \
            -fobjc-arc -Wall -Wextra -I"$FRIDA_DEVKIT" \
            -c bridge/device/native-frida-helper/main.m \
            -o "$out/main.o"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" \
            -std=c11 -Wall -Wextra -Werror \
            -c bridge/device/native-frida-helper/binary-output.c \
            -o "$out/binary-output.o"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" \
            "$out/main.o" "$out/binary-output.o" "$FRIDA_DEVKIT/libfrida-core.a" \
            -lbsm -ldl -lm -lresolv \
            -Wl,-framework,Foundation,-framework,CoreFoundation,-framework,CoreGraphics,-framework,UIKit \
            -o "$out/native-frida-helper"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" \
            -std=c11 -Wall -Wextra -Werror \
            bridge/device/native-runtime-launcher/main.c \
            -o "$out/native-runtime-launcher"
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          ldid -Cadhoc -S "$out/native-frida-helper"
          ldid -Cadhoc -S "$out/native-runtime-launcher"
          python3 - "$out/native-frida-helper" "$out/native-runtime-launcher" <<'PY'
          import pathlib
          import struct
          import sys

          for path in sys.argv[1:]:
              data = pathlib.Path(path).read_bytes()
              if len(data) < 32 or data[:4] != b"\xcf\xfa\xed\xfe":
                  raise SystemExit(f"{path}: expected 64-bit little-endian Mach-O")
              ncmds = struct.unpack_from("<I", data, 16)[0]
              offset = 32
              signature = None
              for _ in range(ncmds):
                  command, size = struct.unpack_from("<II", data, offset)
                  if size < 8 or offset + size > len(data):
                      raise SystemExit(f"{path}: invalid Mach-O load command")
                  if command == 0x1D:
                      _, _, signature_offset, signature_size = struct.unpack_from(
                          "<IIII", data, offset
                      )
                      signature = data[signature_offset:signature_offset + signature_size]
                  offset += size
              if signature is None or len(signature) < 12:
                  raise SystemExit(f"{path}: missing embedded code signature")
              magic, length, count = struct.unpack_from(">III", signature)
              if magic != 0xFADE0CC0 or length > len(signature):
                  raise SystemExit(f"{path}: invalid code signature superblob")
              code_directories = []
              for index in range(count):
                  _, blob_offset = struct.unpack_from(">II", signature, 12 + 8 * index)
                  blob_magic, blob_length = struct.unpack_from(">II", signature, blob_offset)
                  if blob_magic == 0xFADE0C02:
                      if blob_length < 16 or blob_offset + blob_length > length:
                          raise SystemExit(f"{path}: invalid CodeDirectory")
                      code_directories.append(
                          struct.unpack_from(">I", signature, blob_offset + 12)[0]
                      )
              if not code_directories or any(flags & 0x2 == 0 for flags in code_directories):
                  raise SystemExit(f"{path}: every CodeDirectory must carry CS_ADHOC")
              print(f"{path}: CS_ADHOC verified in {len(code_directories)} CodeDirectories")
          PY
          file "$out/native-frida-helper"
          file "$out/native-runtime-launcher"
          lipo -info "$out/native-frida-helper"
          lipo -info "$out/native-runtime-launcher"
          otool -l "$out/native-frida-helper" | grep -A5 -m1 LC_BUILD_VERSION
          otool -l "$out/native-runtime-launcher" | grep -A5 -m1 LC_BUILD_VERSION
          cp bridge/device/native-frida-helper/main.m "$out/main.m"
          cp bridge/device/native-frida-helper/binary-output.c "$out/binary-output.c"
          cp bridge/device/native-frida-helper/binary-output.h "$out/binary-output.h"
          cp bridge/device/native-frida-helper/README.md "$out/README.md"
          cp bridge/device/native-runtime-launcher/main.c "$out/native-runtime-launcher.c"
          cp bridge/device/native-runtime-launcher/README.md "$out/native-runtime-launcher-README.md"
          cp .frida-core-source/COPYING "$out/FRIDA-COPYING"
          printf '%s\n' \
            "Frida 16.3.3 iOS arm64 devkit SHA-256: C31AA39618A6996BF43A472F2F48E3E4C2CC72EEE101A1ED6820192CBF58BDEC" \
            "Frida source tag: 16.3.3" > "$out/BUILD-PROVENANCE.txt"
          (cd "$out" && shasum --algorithm 256 native-frida-helper main.o binary-output.o main.m binary-output.c binary-output.h README.md native-runtime-launcher native-runtime-launcher.c native-runtime-launcher-README.md FRIDA-COPYING BUILD-PROVENANCE.txt > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-frida-helper-ios-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/native-frida-helper/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
